<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIRO Ward Dashboard</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Modular CSS Sheets -->
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modal.css?v=1.1">
  <link rel="stylesheet" href="/css/ward_canvas.css">
  <link rel="stylesheet" href="/css/ward_overview.css?v=1.0">
</head>

<body>

  <!-- =========================================================================
       HEADER: the menu follows the work of the person signed in (Phase 11).
       Everyone: Ward, Patients (with their wristbands), Shift report.
       Admins also: Setup (wards, devices, system status, accounts, test tools).
       ========================================================================= -->
  <header class="global-header">
    <div class="brand-section">
      <div class="brand-logo">🏥</div>
      <div class="brand-title">
        <h1>SHIRO <span class="sub-title">Ward dashboard</span></h1>
      </div>
      <div class="server-status-pill" id="global-status-pill" title="Connection to the SHIRO server. Alarms arrive only while it is connected.">
        <div class="status-dot" id="global-status-dot"></div>
        <span id="global-server-text">Connecting…</span>
      </div>
    </div>

    <nav class="nav-tabs" aria-label="Main menu">
      <button class="nav-tab-btn active" data-tab="tab-ward">Ward</button>
      <button class="nav-tab-btn" data-tab="tab-patients">Patients</button>
      <a class="nav-tab-btn" href="/shift_report.html" target="_blank" rel="noopener" title="Shift summary for handover; opens in a new tab">Shift report ↗</a>

      <!-- Admins only (auth_client.js shows it) -->
      <div class="nav-setup admin-only" id="nav-setup">
        <button class="nav-tab-btn" id="nav-setup-toggle" type="button" aria-haspopup="true" aria-expanded="false">⚙ Setup ▾</button>
        <div class="nav-setup-menu" id="nav-setup-menu" role="menu">
          <button class="nav-menu-item" role="menuitem" data-tab="tab-ward-config">Wards &amp; layout<small>Room size, door, beds, sensors</small></button>
          <button class="nav-menu-item" role="menuitem" data-tab="tab-devices">Devices<small>Wristbands, wall sensors, headsets, LiDAR</small></button>
          <button class="nav-menu-item" role="menuitem" data-tab="tab-health">System status<small>Server, database, connections</small></button>
          <button class="nav-menu-item" role="menuitem" data-tab="tab-admin" id="nav-tab-admin">Accounts &amp; headsets<small>Sign-in accounts, headset pairing, activity log</small></button>
          <button class="nav-menu-item" role="menuitem" data-tab="tab-live-lab">Test tools<small>Live sensor values, test alarms</small></button>
        </div>
      </div>
    </nav>

    <!-- Signed-in clinician (filled in by /js/auth/auth_client.js) -->
    <div class="user-session-badge">
      <div class="user-info">
        <div class="user-name" id="session-user-name">Signing in…</div>
        <div class="user-role" id="session-user-role"></div>
      </div>
      <div class="user-avatar" id="session-user-avatar">?</div>
      <button class="btn btn-outline btn-sm" id="session-logout" style="margin-left: 10px;" title="End this session">Log out</button>
    </div>
  </header>

  <!-- =========================================================================
       PAGES (filled in by /js/app.js)
       ========================================================================= -->
  <main class="app-content">
    <section class="tab-pane active" id="tab-ward">
      <div class="page-loading">Loading the ward…</div>
    </section>

    <section class="tab-pane" id="tab-patients">
      <div class="page-loading">Loading patients…</div>
    </section>

    <section class="tab-pane" id="tab-ward-config">
      <div class="page-loading">Loading wards…</div>
    </section>

    <section class="tab-pane" id="tab-devices">
      <div class="page-loading">Loading devices…</div>
    </section>

    <section class="tab-pane" id="tab-health">
      <div class="page-loading">Loading system status…</div>
    </section>

    <section class="tab-pane" id="tab-live-lab">
      <div class="page-loading">Loading test tools…</div>
    </section>

    <section class="tab-pane" id="tab-admin">
      <div class="page-loading">Loading accounts…</div>
    </section>
  </main>

  <!-- =========================================================================
       DIALOG AND NOTIFICATIONS
       ========================================================================= -->
  <div class="modal-backdrop" id="custom-modal-backdrop">
    <div class="modal-box" id="custom-modal-box">
      <button class="modal-close-btn" id="modal-btn-close" title="Close dialog">&times;</button>
      <div class="modal-header-custom">
        <div class="modal-icon icon-info" id="modal-icon">ℹ️</div>
        <div>
          <div class="modal-title-custom" id="modal-title">Notification</div>
        </div>
      </div>
      <div class="modal-body-custom" id="modal-body">
        Modal message goes here.
      </div>
      <div class="modal-footer-custom">
        <button class="btn btn-outline btn-sm" id="modal-btn-cancel" style="display: none;">Cancel</button>
        <button class="btn btn-primary btn-sm" id="modal-btn-extra" style="display: none;">Extra</button>
        <button class="btn btn-primary btn-sm" id="modal-btn-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="custom-toast-container"></div>

  <!-- =========================================================================
       SCRIPTS
       ========================================================================= -->
  <script src="/js/html_safety.js?v=1.0"></script>
  <script src="/js/ui_kit.js?v=1.0"></script>
  <script src="/js/auth/auth_client.js?v=1.1"></script>
  <script src="/js/modal.js?v=4.1"></script>
  <script src="/js/ws_client.js?v=4.1"></script>
  <script src="/js/alerts/alert_manager.js?v=1.3"></script>
  <script src="/js/ward_config/ward_canvas.js?v=5.4"></script>
  <script src="/js/ward_config/ward_controller.js?v=5.3"></script>
  <script src="/js/ward_config/room_sensor_panel.js?v=1.2"></script>
  <script src="/js/ward_config/room_sensor_live.js?v=1.0"></script>
  <script src="/js/ward_config/placement_planner.js?v=1.0"></script>
  <script src="/js/ward_config/ward_live_map.js?v=6.0"></script>
  <script src="/js/ward_config/position_test_panel.js?v=1.1"></script>
  <script src="/js/patients/patients_controller.js?v=4.4"></script>
  <script src="/js/patients/incident_history.js?v=1.1"></script>
  <script src="/js/patients/patient_wristbands.js?v=1.0"></script>
  <script src="/js/devices/devices_controller.js?v=4.4"></script>
  <script src="/js/live_lab/live_lab_charts.js?v=4.1"></script>
  <script src="/js/health/health_monitor.js?v=1.1"></script>
  <script src="/js/admin/admin_controller.js?v=1.1"></script>
  <script src="/js/app.js?v=4.1"></script>
</body>

</html>
