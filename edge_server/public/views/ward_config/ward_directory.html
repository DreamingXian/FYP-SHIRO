<div id="ward-directory-view">
  <!-- Top Directory Controls Card -->
  <div class="card" style="margin-bottom: 20px; padding: 18px 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;">
      <div>
        <div
          style="font-size: 16px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px;">
          <span class="page-title">Wards &amp; layout</span>
          <span class="badge badge-info" id="ward-total-count">Loading…</span>
        </div>
        <div style="font-size: 14px; color: var(--text-muted); margin-top: 4px;">
          Each ward's room size, door, beds and sensors. The maps and the alerts use this layout.
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <div class="search-input-wrap" style="max-width: 300px;">
          <span class="search-icon">🔍</span>
          <input style="width:300px" type="text" class="form-control" id="ward-search-input"
            placeholder="Search ward" oninput="wardDirectoryPage = 1; filterWardDirectory()">
        </div>
        <button class="btn btn-outline btn-sm" onclick="refreshWardDirectory(this)">🔄 Refresh</button>
        <button class="btn btn-primary btn-sm" onclick="createNewWard()">＋ New ward</button>
      </div>
    </div>
  </div>

  <!-- Directory Table Card -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <span>Wards</span>
      </div>
      <span style="font-size: 13px; color: var(--text-muted);">"Edit layout" opens the floor plan</span>
    </div>

    <div class="data-table-container">
      <table class="data-table" id="wards-directory-table">
        <thead>
          <tr>
            <th>Ward</th>
            <th>Name</th>
            <th>Room size</th>
            <th>Beds</th>
            <th>Wall sensors</th>
            <th>Last changed</th>
            <th style="text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="wards-table-body">
          <!-- Populated dynamically via JavaScript -->
        </tbody>
      </table>
    </div>
    <div id="wards-pager"></div>
  </div>
</div>
